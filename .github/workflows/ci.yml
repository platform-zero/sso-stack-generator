name: CI

on:
  pull_request:
  push:
    branches:
      - dev
      - stable
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install shell tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck

      - name: Check required publication files
        run: |
          test -f README.md
          test -f CONTRIBUTING.md
          test -f LICENSE
          test -f SECURITY.md
          test -f docs/README.md
          test -f docs/project-overview.md
          test -f docs/evaluation-guide.md
          test -f docs/quickstart.md
          test -f docs/testing.md
          test -f docs/assets/platform-home.svg
          test -f docs/assets/trust-boundary.svg
          test -f docs/assets/systemd-orchestration.svg

      - name: Check for private path leaks in public files
        run: |
          ! git grep -nE '(/home/gerald|gerald@|latium\.local|datamancy\.net|labware\.local)' -- \
            README.md CONTRIBUTING.md SECURITY.md AGENTS.md docs scripts ops modules

      - name: Check shell syntax
        run: |
          git ls-files 'scripts/**/*.sh' 'ops/**/*.sh' 'stack.config/**/*.sh' \
            | xargs -r -n1 bash -n

      - name: Run ShellCheck
        run: |
          git ls-files 'scripts/**/*.sh' 'ops/**/*.sh' 'stack.config/**/*.sh' \
            | xargs -r shellcheck -S error -s bash

      - name: Run deploy-state guard checks
        run: ./scripts/test-deploy-state.sh

      - name: Run env-file security checks
        run: ./scripts/test-env-file-security.sh

      - name: Run documentation checks
        run: ./scripts/test-docs.sh

      - name: Run deploy preflight checks
        run: ./scripts/test-deploy-preflight.sh

      - name: Run deploy scope checks
        run: ./scripts/test-deploy-scope.sh

      - name: Run install bundle checks
        run: ./scripts/test-install-bundle.sh

      - name: Run stackctl user checks
        run: ./scripts/test-stackctl-users.sh

  generator-tests:
    name: Generator script tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run module runner checks
        run: ./scripts/test-module-runners.sh

      - name: Run external module checks
        run: ./scripts/test-external-modules.sh

      - name: Run pull-module checks
        run: ./scripts/test-pull-modules.sh

      - name: Run mount diagnostic checks
        run: ./scripts/test-mount-diagnostics.sh

      - name: Run component selection checks
        run: ./scripts/test-component-selection.sh

      - name: Run contract report checks
        run: ./scripts/test-contract-reports.sh

      - name: Run host lifecycle static checks
        run: ./scripts/test-host-lifecycle-static.sh

      - name: Run Jellyfin FFmpeg compatibility checks
        run: ./scripts/test-jellyfin-ffmpeg-websafe.sh

      - name: Run service contract checks
        run: ./scripts/test-service-contracts.sh

  module-composition:
    name: Clean all-module composition
    runs-on: ubuntu-24.04
    steps:
      - name: Check out generator
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install composition tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq rsync shellcheck

      - name: Check out active module repositories
        run: ./scripts/pull-modules.sh --workspace "$RUNNER_TEMP/module-workspace" dev-all

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ${{ runner.temp }}/module-workspace/test-runners-stack-module/stack.containers/test-runner/playwright-tests/package-lock.json

      - name: Validate clean module composition
        run: ./scripts/test-module-composition.sh "$RUNNER_TEMP/module-workspace"
