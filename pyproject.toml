[project]
name = "p0-core"
version = "2.0.0a1"
description = "Deterministic P0 service graph and Quadlet lifecycle tooling"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
p0 = "p0core.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["p0core"]
